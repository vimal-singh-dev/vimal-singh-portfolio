<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vimal Singh | B.Tech IT — Software Development, Cloud & DevOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-display: 'Cormorant Garamond', Georgia, serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 90px;
        background-color: #0f0e0d;
        color: #f5f2eb;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0e0d;
      }
      ::-webkit-scrollbar-thumb {
        background: #2b2724;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c26747;
      }

      body {
        font-family: var(--font-body);
        background-color: #0f0e0d;
        color: #f5f2eb;
        overflow-x: hidden;
      }

      h1, h2, h3, .font-serif-display {
        font-family: var(--font-display);
      }

      .font-mono-code {
        font-family: var(--font-mono);
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-[#070913] text-slate-100 selection:bg-cyan-500 selection:text-black min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
